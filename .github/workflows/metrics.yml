name: Generate metrics

# Roda no proprio repo e commita metrics.svg na main.
# Diferente do github-readme-stats (que esta com 503 ha dias), isso nao
# depende do Vercel de terceiro nenhum.
#
# TOKEN: funciona sem configurar nada, usando o GITHUB_TOKEN do Actions,
# mas ai so enxerga os repositorios publicos. Para contar tambem os
# privados, crie um Personal Access Token com escopo `repo` e salve como
# secret METRICS_TOKEN — o workflow passa a usa-lo automaticamente.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Painel geral
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          base: header, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, dockerfile, makefile, procfile
          plugin_languages_sections: most-used

      - name: Calendario isometrico
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: metrics-calendar.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
