name: Generate contribution games

# Gera as animacoes do grafico de contribuicao e publica na branch `output`.
# Snake e Bomberman sao gerados no mesmo job de proposito: os dois publicam
# na mesma branch, e em workflows separados o segundo apagaria o primeiro.

on:
  schedule:
    # Todo dia as 00:00 UTC (21:00 em Sao Paulo)
    - cron: "0 0 * * *"
  workflow_dispatch: # permite rodar na mao pela aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Bomberman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: bomberman

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # O bomberman sai rapido demais do gerador. As animacoes nao usam
      # `begin=` e os `keyTimes` sao fracoes, entao multiplicar todos os
      # `dur` pelo mesmo fator desacelera sem dessincronizar nada.
      # Ajuste FATOR para mudar a velocidade: 2 = metade da velocidade.
      - name: Desacelerar o bomberman
        run: |
          node -e '
            const fs = require("fs");
            const FATOR = 2;
            const alvos = fs.readdirSync("dist").filter(f => f.startsWith("bomberman"));
            for (const nome of alvos) {
              const caminho = "dist/" + nome;
              let n = 0;
              const svg = fs.readFileSync(caminho, "utf8").replace(
                /dur="(\d+(?:\.\d+)?)(ms|s)"/g,
                (_, valor, unidade) => { n++; return `dur="${+valor * FATOR}${unidade}"`; }
              );
              fs.writeFileSync(caminho, svg);
              console.log(`${nome}: ${n} animacoes desaceleradas ${FATOR}x`);
            }
          '

      - name: Publicar tudo na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
